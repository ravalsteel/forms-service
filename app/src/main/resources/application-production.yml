springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8095}
  endpoint:
    health:
      show-details: when_authorized
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}

logging:
  level:
    root: WARN
    com.ravalgroups.forms: INFO
