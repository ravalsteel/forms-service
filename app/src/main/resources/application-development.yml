# Local and docker-compose.dev.yml runtime.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8095}
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}

logging:
  level:
    com.ravalgroups.forms: INFO
    org.springframework.web: INFO
